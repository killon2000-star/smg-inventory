# firestore.rules 가 바뀌면 Firebase에 자동으로 게시합니다.
# 한 번만 준비: 저장소 Settings › Secrets and variables › Actions 에 FIREBASE_SERVICE_ACCOUNT (서비스 계정 키 JSON 전체) 등록
name: Firestore 보안 규칙 게시
on:
  push:
    branches: [main]
    paths: [firestore.rules, firebase.json, .github/workflows/firestore-rules.yml]
  workflow_dispatch:
jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 키가 등록돼 있는지 확인
        id: chk
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "FIREBASE_SERVICE_ACCOUNT 비밀값이 없어 건너뜁니다"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: google-github-actions/auth@v2
        if: steps.chk.outputs.ok == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: 보안 규칙 게시
        if: steps.chk.outputs.ok == 'true'
        run: npx -y firebase-tools@13.29.1 deploy --only firestore:rules --project smg-inventory-677e3 --non-interactive
